version: "3.8"

services:
  backend:
    image: vaishnav1133/mern-backend:latest
    container_name: mern-backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://host.docker.internal:27017/mern_cicd
      JWT_SECRET: mySuperSecretKey123

  frontend:
    image: vaishnav1133/mern-frontend:latest
    container_name: mern-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped